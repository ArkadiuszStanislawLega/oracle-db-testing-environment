---
- name: Zero to DB - Completed Provisioning Oracle 19c SE2 - no ASM
  hosts: all
  become: yes
  gather_facts: no

  pre_tasks:
    - name: Bootstrap Python 3.9
      raw: yum install -y python39
      changed_when: false

    - name: Gathering facts
      setup:

  vars:
    ansible_python_interpreter: /usr/bin/python3.9
    dir_ora_inventory: "/u01/app/oraInventory"
    dir_oracle_base: "/u01/app/oracle"
    dir_db_home: "/u01/app/oracle/product/19.3.0/dbhome_1"
    
    dir_bin: "/u01"
    dir_u02_base: "/u02/app/oracle"
    dir_db_logs: "/u02"
    dir_cdb: "{{ dir_db_logs }}/oradata"
    dir_db_mirr: "/u03"
    dir_db_backup: "/u04"
    dir_pdb1: "/u05/oradata"
    dir_pdb2: "/u06/oradata"
    dir_pdb3: "/u07/oradata"
    dir_s3_golden_mount: "/golden_image"

    s3_bucket: "oracle-test-backups-terraform"
    s3_golden_bucket: "oracle-golden-images-terraform"

    passwords: "aoeuiAOEUI9"
    name_cdb: "TESTCDB"
    name_pdb1: "TEST1PDB"
    name_pdb2: "TEST2PDB"
    name_pdb3: "TEST3PDB"

  tasks:
    - name: Adding EPEL repo
      yum:
        name: oracle-epel-release-el8
        state: present

    - name: Installing sys packages
      yum:
        name:
          - oracle-database-preinstall-19c
          - s3fs-fuse
          - lvm2
          - unzip
          - vim
          - tmux
        state: present

    - name: Shutting down SELinux
      block:
        - lineinfile:
            path: /etc/selinux/config
            regexp: '^SELINUX='
            line: SELINUX=permissive
        - shell: setenforce 0
          failed_when: false

    - name: Update oracle password
      user:
        name: oracle
        password: "{{ 'aoeuiAOEUI9' | password_hash('sha512') }}"

    - name: Configuring environment
      block:
        - name: Create vim config
          copy:
            dest: "/home/{{ item }}/.vimrc"
            owner: "{{ item }}"
            group: oinstall
            content: |
              set number
              set relativenumber
          loop: [ec2-user, oracle]
        - name: Create tmux config
          copy:
            dest: "/home/{{ item }}/.tmux.conf"
            owner: "{{ item }}"
            group: oinstall
            content: |
              set -g mouse on
              set -g mode-keys vi
              bind h split-window -h -c "#{pane_current_path}"
              bind v split-window -v -c "#{pane_current_path}"
          loop: [ec2-user, oracle]
        - name: Update bashrc
          blockinfile:
            path: "/home/{{ item }}/.bashrc"
            owner: "{{ item }}"
            group: oinstall
            content: |
              set -o vi
          loop: [ ec2-user, oracle]
        - name: Update bash_profile
          blockinfile:
            path: "/home/oracle/.bash_profile"
            create: yes
            owner: oracle
            group: oinstall
            content: |
              if [ -f ~/.bashrc ]; then . ~/.bashrc; fi
              export ORACLE_SID={{ name_cdb }} 
              export PATH=$ORACLE_HOME/bin:$PATH
              export ORAENV_ASK=NO 
              . /usr/local/bin/oraenv 
              unset ORAENV_ASK'

              alias ll='ls -lah'

    # ================== 2. DYNAMICZNE MAPOWANIE DYSKÓW I LVM ==================
    - name: Gathering info about NVMe
      shell: lsblk -d -n -o NAME,SIZE | grep nvme
      register: nvme_disks
      changed_when: false

    - name: Get 30GB disk
      shell: lsblk -d -n -b -o NAME,SIZE | awk '$1 != "nvme0n1" && $2 > 20000000000 {print "/dev/"$1}' | head -n 1
      register: disk_30g
      changed_when: false

    - name: Get lower than 15GB disks
      shell: lsblk -d -n -b -o NAME,SIZE | awk '$1 != "nvme0n1" && $2 < 15000000000 {print "/dev/"$1}'
      register: disks_10g
      changed_when: false

    - name: Defining dynamic volumens list
      set_fact:
        lvm_volumes:
          - { device: "{{ disk_30g.stdout }}", vg: "u01vg", lv: "binlv", mount: "{{ dir_bin }}" }
          - { device: "{{ disks_10g.stdout_lines[0] }}", vg: "u02vg", lv: "loglv", mount: "{{ dir_db_logs }}" }
          - { device: "{{ disks_10g.stdout_lines[1] }}", vg: "u03vg", lv: "mirrlv", mount: "{{ dir_db_mirr }}" }
          - { device: "{{ disks_10g.stdout_lines[2] }}", vg: "u04vg", lv: "pdb1lv", mount: "{{ dir_pdb1 }}" }
          - { device: "{{ disks_10g.stdout_lines[3] }}", vg: "u05vg", lv: "pdb2lv", mount: "{{ dir_pdb2 }}" }
          - { device: "{{ disks_10g.stdout_lines[4] }}", vg: "u06vg", lv: "pdb3lv", mount: "{{ dir_pdb3 }}" }

    - name: Creating and mounting LVMs
      block:
        - file: path="{{ item.mount }}" state=directory mode='0755'
          loop: "{{ lvm_volumes }}"
        - lvg: vg="{{ item.vg }}" pvs="{{ item.device }}"
          loop: "{{ lvm_volumes }}"
        - lvol: vg="{{ item.vg }}" lv="{{ item.lv }}" size=100%FREE shrink=no
          loop: "{{ lvm_volumes }}"
        - filesystem: fstype=xfs dev="/dev/{{ item.vg }}/{{ item.lv }}"
          loop: "{{ lvm_volumes }}"
        - mount: path="{{ item.mount }}" src="/dev/{{ item.vg }}/{{ item.lv }}" fstype=xfs opts=defaults state=mounted
          loop: "{{ lvm_volumes }}"

    - name: Adding directories
      file:
        path: "{{ item }}"
        owner: oracle
        group: oinstall
        state: directory
        mode: '0775'
        recurse: yes
      loop:
        - "{{ dir_db_home }}"
        - "{{ dir_ora_inventory }}"
        - "{{ dir_db_logs }}/oradata"
        - "{{ dir_db_logs }}/fast_recovery_area"
        - "{{ dir_db_logs }}/backup_logs"
        - "{{ dir_u02_base }}/diag"
        - "{{ dir_u02_base }}/audit"
        - "{{ dir_pdb1 }}"
        - "{{ dir_pdb2 }}"
        - "{{ dir_pdb3 }}"
        - "{{ dir_db_mirr }}/oradata"
        - "{{ dir_db_mirr }}/oradata/{{ name_cdb }}"
        - "{{ dir_db_mirr }}/archivelog"

    - name: Gathering IDs
      command: id -{{ item }} oracle
      register: ids
      loop: ['u', 'g']
      changed_when: false

    - name: Mounting S3 buckets 
      block:
        - modprobe: name=fuse state=present
        - file: path="{{ item }}" state=directory owner=oracle group=oinstall mode='0775'
          loop: ["{{ dir_s3_golden_mount }}", "{{ dir_db_backup }}"]
        - file: src=/usr/bin/s3fs dest=/sbin/mount.s3fs state=link
        - mount: path="{{ dir_db_backup }}" src="{{ s3_bucket }}" fstype=s3fs opts="_netdev,allow_other,iam_role=auto,url=https://s3.eu-central-1.amazonaws.com,endpoint=eu-central-1,uid={{ ids.results[0].stdout }},gid={{ ids.results[1].stdout }},umask=022,connect_timeout=5,retries=3" state=mounted
        - mount: path="{{ dir_s3_golden_mount }}" src="{{ s3_golden_bucket }}" fstype=s3fs opts="_netdev,allow_other,iam_role=auto,url=https://s3.eu-central-1.amazonaws.com,endpoint=eu-central-1,uid={{ ids.results[0].stdout }},gid={{ ids.results[1].stdout }},umask=022,connect_timeout=5,retries=3" state=mounted

    - name: Adding directories for backup
      file:
        path: "{{ item }}"
        owner: oracle
        group: oinstall
        state: directory
        mode: '0775'
        recurse: yes
      loop:
        - "{{ dir_db_backup }}"
        - "{{ dir_db_backup }}/{{ name_cdb }}/rman_backups"
        - "{{ dir_db_backup }}/{{ name_cdb }}/autobackup"

    - name: Unzip DB home 19.3.0
      unarchive:
        src: "{{ dir_s3_golden_mount }}/LINUX.X64_193000_db_home.zip"
        dest: "{{ dir_db_home }}"
        remote_src: yes
        owner: oracle
        group: oinstall
      args:
        creates: "{{ dir_db_home }}/bin/sqlplus"

    - name: Silent db engine installation 19.3.0
      become_user: oracle
      shell: |
        {{ dir_db_home }}/runInstaller -silent -waitforcompletion -ignorePrereqFailure \
        oracle.install.option=INSTALL_DB_SWONLY \
        UNIX_GROUP_NAME=oinstall \
        INVENTORY_LOCATION={{ dir_ora_inventory }} \
        ORACLE_HOME={{ dir_db_home }} \
        ORACLE_BASE={{ dir_oracle_base }} \
        oracle.install.db.InstallEdition=SE2 \
        oracle.install.db.OSDBA_GROUP=dba \
        oracle.install.db.OSOPER_GROUP=dba \
        oracle.install.db.OSBACKUPDBA_GROUP=dba \
        oracle.install.db.OSDGDBA_GROUP=dba \
        oracle.install.db.OSKMDBA_GROUP=dba \
        oracle.install.db.OSRACDBA_GROUP=dba
        RC=$?
        if [ $RC -eq 0 ] || [ $RC -eq 6 ]; then touch {{ dir_db_home }}/.ansible_db_installed; exit 0; else exit $RC; fi
      environment: { CV_ASSUME_DISTID: "OEL7.6" }
      args:
        creates: "{{ dir_db_home }}/.ansible_db_installed"
        executable: /bin/bash

    - name: Executing root.sh for db
      shell: "{{ item }}"
      loop:
        - "{{ dir_ora_inventory }}/orainstRoot.sh"
        - "{{ dir_db_home }}/root.sh"
      args:
        creates: "/etc/oratab"

    - name: Creating CDB 
      become_user: oracle
      shell: |
        {{ dir_db_home }}/bin/dbca -silent -createDatabase -templateName General_Purpose.dbc \
        -gdbname {{ name_cdb }} -sid {{ name_cdb }} -responseFile NO_VALUE -characterSet AL32UTF8 \
        -sysPassword "{{ passwords }}" -systemPassword "{{ passwords }}" \
        -createAsContainerDatabase true -numberOfPDBs 0 \
        -databaseType MULTIPURPOSE -automaticMemoryManagement false -totalMemory 4096 \
        -storageType FS -datafileDestination {{ dir_db_logs }}/oradata \
        -recoveryAreaDestination {{ dir_db_logs }}/fast_recovery_area -recoveryAreaSize 4096
      args:
        creates: "{{ dir_oracle_base }}/admin/{{ name_cdb }}/adump"

    - name: Adding 3 PDB to CDB
      become_user: oracle
      shell: |
        source ~/.bash_profile
        sqlplus -s / as sysdba <<EOF
        CREATE PLUGGABLE DATABASE {{ name_pdb1 }} ADMIN USER pdbadmin IDENTIFIED BY "{{ passwords }}"
          FILE_NAME_CONVERT=('{{ dir_cdb }}/{{ name_cdb }}/pdbseed/', '{{ dir_pdb1 }}/{{ name_cdb }}/{{ name_pdb1 }}/');
        CREATE PLUGGABLE DATABASE {{ name_pdb2 }} ADMIN USER pdbadmin IDENTIFIED BY "{{ passwords }}"
          FILE_NAME_CONVERT=('{{ dir_cdb }}/{{ name_cdb }}/pdbseed/', '{{ dir_pdb2 }}/{{ name_cdb }}/{{ name_pdb2 }}/');
        CREATE PLUGGABLE DATABASE {{ name_pdb3 }} ADMIN USER pdbadmin IDENTIFIED BY "{{ passwords }}"
          FILE_NAME_CONVERT=('{{ dir_cdb }}/{{ name_cdb }}/pdbseed/', '{{ dir_pdb3 }}/{{ name_cdb }}/{{ name_pdb3 }}/');
        ALTER PLUGGABLE DATABASE ALL OPEN;
        ALTER PLUGGABLE DATABASE ALL SAVE STATE;
        EXIT;
        EOF
      args:
        executable: /bin/bash

    - name: Configuring RMAN
      become_user: oracle
      shell: |
        source ~/.bash_profile
        rman target / <<EOF
        CONFIGURE DEFAULT DEVICE TYPE TO DISK;
        CONFIGURE CONTROLFILE AUTOBACKUP ON;
        CONFIGURE BACKUP OPTIMIZATION ON;
        CONFIGURE CHANNEL DEVICE TYPE DISK FORMAT '{{ dir_db_backup }}/{{ name_cdb }}/rman_backups/%d_%T_%U.bkp';
        CONFIGURE CONTROLFILE AUTOBACKUP FORMAT FOR DEVICE TYPE DISK TO '{{ dir_db_backup }}/{{ name_cdb }}/autobackup/ctl_%F';
        CONFIGURE DEVICE TYPE DISK BACKUP TYPE TO COMPRESSED BACKUPSET;
        CONFIGURE ARCHIVELOG DELETION POLICY TO BACKED UP 1 TIMES TO DISK;
        CONFIGURE RETENTION POLICY TO RECOVERY WINDOW OF 5 DAYS;
        EXIT;
        EOF
      args:
        executable: /bin/bash

    - name: Configuring mirrors files and logs files
      become_user: oracle
      shell: |
        source ~/.bash_profile
        
        sqlplus -s / as sysdba <<EOF
        ALTER SYSTEM SET control_files='{{ dir_db_logs }}/oradata/{{ name_cdb }}/control01.ctl', '{{ dir_db_mirr }}/oradata/{{ name_cdb }}/control02.ctl' SCOPE=SPFILE;
        ALTER SYSTEM SET audit_file_dest='{{ dir_db_logs }}/app/oracle/audit' SCOPE=SPFILE;
        ALTER SYSTEM SET diagnostic_dest='{{ dir_db_logs }}/app/oracle' SCOPE=SPFILE;
        
        SHUTDOWN IMMEDIATE;
        !cp {{ dir_db_logs }}/oradata/{{ name_cdb }}/control01.ctl {{ dir_db_mirr }}/oradata/{{ name_cdb }}/control02.ctl

        STARTUP MOUNT;
        ALTER DATABASE ARCHIVELOG;
        ALTER DATABASE OPEN;
        
        ALTER DATABASE ADD LOGFILE MEMBER '{{ dir_db_mirr }}/oradata/{{ name_cdb }}/redo01_mirror.log' TO GROUP 1;
        ALTER DATABASE ADD LOGFILE MEMBER '{{ dir_db_mirr }}/oradata/{{ name_cdb }}/redo02_mirror.log' TO GROUP 2;
        ALTER DATABASE ADD LOGFILE MEMBER '{{ dir_db_mirr }}/oradata/{{ name_cdb }}/redo03_mirror.log' TO GROUP 3;
        
        EXIT;
        EOF
      args:
        executable: /bin/bash

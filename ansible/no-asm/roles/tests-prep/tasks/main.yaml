---
- name: Ensure Oracle scripts directory exists
  ansible.builtin.file:
    path: "/home/oracle/scripts"
    state: directory
    owner: oracle
    group: oinstall
    mode: "0750"

- name: Ensure Oracle scripts and SQL directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: oracle
    group: oinstall
    mode: "0750"
  loop:
    - "/home/oracle/scripts"
    - "/home/oracle/scripts/sql"

- name: Copy standalone SQL and RMAN scripts
  ansible.builtin.copy:
    src: "sql/{{ item }}"
    dest: "/home/oracle/scripts/sql/{{ item }}"
    owner: oracle
    group: oinstall
    mode: "0640"
  loop:
    - check_pdb_topology.sql
    - init_pitr_pdb.sql
    - record_pitr_beat.sql
    - inspect_pitr_pdb.sql
    - verify_pitr_pdb.sql
    - db_lifecycle_op.sql
    - status_pitr_cdb.sql
    - harden_se2_cdb.sql
    - resize_redo_logs.sql
    - purge_fra_archivelogs.rcv

- name: Deploy Oracle Common Bash Library from template
  ansible.builtin.template:
    src: "lib_oracle_common.sh.j2"
    dest: "/home/oracle/scripts/lib_oracle_common.sh"
    owner: oracle
    group: oinstall
    mode: "0640"

- name: Deploy operational Bash scripts from templates
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/home/oracle/scripts/{{ item }}"
    owner: oracle
    group: oinstall
    mode: "0750"
  loop:
    - pitr_ctl.sh
    - sync_archivelogs.sh
    - daily_snapshot.sh

- name: Setup Cron for Continuous Archivelog Sync (Every 15 mins)
  ansible.builtin.cron:
    name: "Sync Oracle Archivelogs to S3"
    user: oracle
    minute: "*/15"
    job: "/home/oracle/scripts/sync_archivelogs.sh"


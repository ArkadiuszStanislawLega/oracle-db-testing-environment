---
- name: Adding EPEL repo
  yum:
    name: oracle-epel-release-el8
    state: present

- name: Installing sys packages
  yum:
    name:
      - oracle-database-preinstall-19c
      - awscli
      - lvm2
      - unzip
      - vim
      - tmux
      - perl
    state: present

- name: Shutting down SELinux
  block:
    - lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: SELINUX=permissive
    - shell: setenforce 0
      failed_when: false

- name: Update oracle password
  user:
    name: oracle
    password: "{{ 'aoeuiAOEUI9' | password_hash('sha512') }}"

- name: Configuring environment
  block:
    - name: Create vim config
      copy:
        dest: "/home/{{ item }}/.vimrc"
        owner: "{{ item }}"
        group: oinstall
        content: |
          set number
          set relativenumber
      loop: [ec2-user, oracle]
    - name: Create tmux config
      copy:
        dest: "/home/{{ item }}/.tmux.conf"
        owner: "{{ item }}"
        group: oinstall
        content: |
          set -g mouse on
          set -g mode-keys vi
          bind h split-window -h -c "#{pane_current_path}"
          bind v split-window -v -c "#{pane_current_path}"
      loop: [ec2-user, oracle]
    - name: Update bashrc
      blockinfile:
        path: "/home/{{ item }}/.bashrc"
        owner: "{{ item }}"
        group: oinstall
        content: |
          set -o vi
      loop: [ ec2-user, oracle]
    - name: Update bash_profile
      blockinfile:
        path: "/home/oracle/.bash_profile"
        create: yes
        owner: oracle
        group: oinstall
        content: |
          if [ -f ~/.bashrc ]; then . ~/.bashrc; fi
          export ORACLE_SID={{ name_cdb }} 
          export PATH=$ORACLE_HOME/bin:$PATH
          export ORAENV_ASK=NO 
          . /usr/local/bin/oraenv 
          unset ORAENV_ASK

          alias ll='ls -lah'

- name: Gathering info about NVMe
  shell: lsblk -d -n -o NAME,SIZE | grep nvme
  register: nvme_disks
  changed_when: false

- name: Dispatcher - Precise Disk Discovery based on exact byte size
  ansible.builtin.shell: |
    lsblk -d -n -b -o NAME,SIZE | awk '
      $1 ~ /^nvme[1-9]n1$/ {
        if ($2 == 53687091200) print "50G:/dev/"$1
        else if ($2 == 21474836480) print "20G:/dev/"$1
        else if ($2 == 10737418240) print "10G:/dev/"$1
      }'
  register: raw_disk_layout
  changed_when: false

- name: Parse and categorize disk topologies
  ansible.builtin.set_fact:
    disk_50g: "{{ raw_disk_layout.stdout_lines | select('match', '^50G:') | map('replace', '50G:', '') | list }}"
    disk_20g: "{{ raw_disk_layout.stdout_lines | select('match', '^20G:') | map('replace', '20G:', '') | list }}"
    disks_10g: "{{ raw_disk_layout.stdout_lines | select('match', '^10G:') | map('replace', '10G:', '') | list | sort }}"

- name: Guard Clauses - Validate Expected Disk Topology
  ansible.builtin.assert:
    that:
      - disk_50g | length == 1
      - disk_20g | length == 1
      - disks_10g | length == 5
    fail_msg: >
      [CRITICAL] Topology mismatch! Expected: 1x50G, 1x20G, 5x10G.
      Found: 50G={{ disk_50g|length }}, 20G={{ disk_20g|length }}, 10G={{ disks_10g|length }}.
      Synchronize your Terraform IaC configuration!

- name: Defining dynamic volumes list
  ansible.builtin.set_fact:
    lvm_volumes:
      - { device: "{{ disk_50g[0] }}", vg: "u01vg", lv: "binlv", mount: "{{ dir_bin }}" }
      - { device: "{{ disks_10g[0] }}", vg: "u02vg", lv: "loglv", mount: "{{ dir_db_logs }}" }
      - { device: "{{ disks_10g[1] }}", vg: "u03vg", lv: "mirrlv", mount: "{{ dir_db_mirr }}" }
      - { device: "{{ disk_20g[0] }}", vg: "u04vg", lv: "fralv", mount: "{{ dir_db_archive }}" } 
      - { device: "{{ disks_10g[2] }}", vg: "u05vg", lv: "pdb1lv", mount: "{{ dir_pdb1 }}" }
      - { device: "{{ disks_10g[3] }}", vg: "u06vg", lv: "pdb2lv", mount: "{{ dir_pdb2 }}" }
      - { device: "{{ disks_10g[4] }}", vg: "u07vg", lv: "pdb3lv", mount: "{{ dir_pdb3 }}" }

- name: Creating and mounting LVMs
  block:
    - file: path="{{ item.mount }}" state=directory mode='0755'
      loop: "{{ lvm_volumes }}"
    - lvg: vg="{{ item.vg }}" pvs="{{ item.device }}"
      loop: "{{ lvm_volumes }}"
    - lvol: vg="{{ item.vg }}" lv="{{ item.lv }}" size=100%FREE shrink=no
      loop: "{{ lvm_volumes }}"
    - filesystem: fstype=xfs dev="/dev/{{ item.vg }}/{{ item.lv }}"
      loop: "{{ lvm_volumes }}"
    - mount: path="{{ item.mount }}" src="/dev/{{ item.vg }}/{{ item.lv }}" fstype=xfs opts=defaults state=mounted
      loop: "{{ lvm_volumes }}"

- name: Adding directories
  file:
    path: "{{ item }}"
    owner: oracle
    group: oinstall
    state: directory
    mode: '0775'
    recurse: yes
  loop:
    - "{{ dir_db_home }}"
    - "{{ dir_ora_inventory }}"
    - "{{ dir_db_logs }}/oradata"
    - "{{ dir_db_logs }}/fast_recovery_area"
    - "{{ dir_db_logs }}/backup_logs"
    - "{{ dir_u02_base }}/diag"
    - "{{ dir_u02_base }}/audit"
    - "{{ dir_pdb1 }}"
    - "{{ dir_pdb2 }}"
    - "{{ dir_pdb3 }}"
    - "{{ dir_db_mirr }}/oradata"
    - "{{ dir_db_mirr }}/oradata/{{ name_cdb }}"
    - "{{ dir_db_mirr }}/archivelog"
    - "{{ dir_patch_stage }}"
    - "{{ dir_db_archive }}"

- name: Download binaries
  ansible.builtin.command:
    cmd: "aws s3 cp s3://{{ s3_golden_bucket }}/{{ item }} {{ dir_patch_stage }}/{{ item }}"
    creates: "{{ dir_patch_stage }}/{{ item }}"
  become: true
  become_user: oracle
  loop:
    - LINUX.X64_193000_db_home.zip
    - p6880880_190000_Linux-x86-64.zip
    - p39034528_190000_Linux-x86-64.zip
    - p38906621_190000_Linux-x86-64.zip
    - p39791916_190000_Linux-x86-64.zip

- name: Gathering IDs
  command: id -{{ item }} oracle
  register: ids
  loop: ['u', 'g']
  changed_when: false

- name: Check is swap exists
  stat:
    path: /swapfile
  register: swap_stat

- name: Create 2GB SWAP
  command: dd if=/dev/zero of=/swapfile bs=1M count=2048
  when: not swap_stat.stat.exists

- name: Add privilage
  file:
    path: /swapfile
    owner: root
    group: root
    mode: '0600'

- name: Inicialise SWAP
  command: mkswap /swapfile
  when: not swap_stat.stat.exists

- name: Activate SWAP
  command: swapon /swapfile
  when: not swap_stat.stat.exists

- name: Add SWAP to fstab
  mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    passno: '0'
    dump: '0'
    state: present

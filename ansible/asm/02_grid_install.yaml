---
- name: Instalacja Oracle Grid Infrastructure 19c (Oracle Restart)
  hosts: all
  become: yes
  gather_facts: no
  vars:
    # Nazwa Twojego pliku instalacyjnego, ktory juz lezy w /u01
    grid_zip_src: "/u01/LINUX.X64_193000_grid_home.zip"
    
    oracle_base: "/u01/app/oracle"
    grid_home: "/u01/app/19.3.0/grid"
    ora_inventory: "/u01/app/oraInventory"

  pre_tasks:
    - name: Przełączenie interpretera Ansible na Pythona 3.9
      set_fact:
        ansible_python_interpreter: /usr/bin/python3.9

  tasks:
    - name: Utworzenie katalogów dla Grid Infrastructure i Inventory
      file:
        path: "{{ item }}"
        state: directory
        owner: oracle
        group: oinstall
        mode: '0775'
        recurse: yes
      loop:
        - "{{ grid_home }}"
        - "{{ ora_inventory }}"

    - name: Rozpakowanie pliku zip Grida bezpośrednio do GRID_HOME
      unarchive:
        src: "{{ grid_zip_src }}"
        dest: "{{ grid_home }}"
        owner: oracle
        group: oinstall
        remote_src: yes
        creates: "{{ grid_home }}/gridSetup.sh"

    - name: Instalacja pakietu cvuqdisk z plików źródłowych Grida (wymagane przez CVU)
      dnf:
        name: "{{ grid_home }}/cv/rpm/cvuqdisk-1.0.10-1.rpm"
        state: present
        disable_gpg_check: yes
      environment:
        CVUQDISK_GRP: "oinstall"

    - name: Wygenerowanie pliku odpowiedzi (Response File) dla Grid Setup
      copy:
        dest: "/home/oracle/grid_install.rsp"
        owner: oracle
        group: oinstall
        mode: '0644'
        content: |
          oracle.install.responseFileVersion=/oracle/install/rspfmt_crsinstall_response_schema_v19.0.0
          oracle.install.option=HA_CONFIG
          ORACLE_BASE={{ oracle_base }}
          INVENTORY_LOCATION={{ ora_inventory }}
          oracle.install.asm.OSDBA=asmdba
          oracle.install.asm.OSOPER=asmoper
          oracle.install.asm.OSASM=asmadmin
          oracle.install.asm.diskGroup.name=DATA
          oracle.install.asm.diskGroup.redundancy=EXTERNAL
          oracle.install.asm.diskGroup.AUSize=4
          oracle.install.asm.diskGroup.diskDiscoveryString=/dev/nvme*
          oracle.install.asm.diskGroup.disks=/dev/nvme3n1,/dev/nvme4n1,/dev/nvme5n1,/dev/nvme6n1
          oracle.install.asm.configureGIMRDataDG=false
          oracle.install.asm.monitorPassword=SysPassword123!
          oracle.install.asm.SYSASMPassword=SysPassword123!
    - name: Cicha instalacja i konfiguracja Grid (tworzenie puli +DATA)
      become_user: oracle
      command: >
        {{ grid_home }}/gridSetup.sh -silent -waitforcompletion -responseFile /home/oracle/grid_install.rsp -ignorePrereqFailure
      environment:
        CV_ASSUME_DISTID: "OEL7.6"
      register: grid_setup_output
      failed_when: grid_setup_output.rc not in [0, 6]
      args:
        creates: "{{ ora_inventory }}/orainstRoot.sh"

    - name: Wykonanie skryptu orainstRoot.sh
      command: "{{ ora_inventory }}/orainstRoot.sh"
      register: orainst_out
      changed_when: true
      args:
        creates: /etc/oraInst.loc

    - name: Wykonanie skryptu root.sh dla infrastruktury Grid (to potrwa dobre kilka minut)
      command: "{{ grid_home }}/root.sh"
      register: root_out
      changed_when: true
      environment:
        CV_ASSUME_DISTID: "OEL7.6"
      args:
        creates: /etc/oracle/olr.loc

    - name: Opcjonalnie usunięcie pliku ZIP po udanej instalacji
      file:
        path: "{{ grid_zip_src }}"
        state: absent

    - name: Konfiguracja grupy dyskowej +RECOVERY w ASM
      become_user: oracle
      command: >
        {{ grid_home }}/bin/asmca -silent -addDiskGroup
        -diskGroupName RECOVERY
        -diskList /dev/nvme7n1,/dev/nvme8n1
        -redundancy EXTERNAL
      environment:
        ORACLE_HOME: "{{ grid_home }}"
        ORACLE_SID: "+ASM"
      register: asmca_output
      failed_when: "asmca_output.rc != 0 and 'already exists' not in asmca_output.stdout"
